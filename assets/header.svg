<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <!-- Фильтр для свечения вместо text-shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Анимация свечения через opacity + filter */
      @keyframes glowPulse {
        0% { opacity: 0.7; filter: url(#glow); }
        50% { opacity: 1; filter: url(#glow); }
        100% { opacity: 0.7; filter: url(#glow); }
      }
      
      /* Анимация появления снизу */
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(25px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .title {
        animation: glowPulse 2s infinite ease-in-out;
        font-size: 52px;
        fill: #ffffff;
        font-weight: bold;
        font-family: 'Fira Code', monospace;
      }
      
      .sub {
        animation: slideUp 2.5s ease-out;
        font-size: 20px;
        fill: #cccccc;
        font-family: 'Fira Code', monospace;
      }
    </style>
  </defs>

  <!-- Черный фон -->
  <rect width="800" height="200" fill="#0a0a0a00" />

  <!-- Заголовок -->
  <text x="400" y="70" text-anchor="middle" class="title">𝑴𝒂𝒈𝒆𝒏𝒕𝒂</text>

  <!-- Цитата (разбита на две строки) -->
  <text x="400" y="115" text-anchor="middle" class="sub">
    «Simplicity is the soul of efficiency.»
  </text>
</svg>